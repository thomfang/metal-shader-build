name: build-border-beam-shader

on:
  push:
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Metal toolchain
        run: |
          set -eux
          if ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || true
          fi
          xcrun -f metal

      - name: Compile metallib
        run: |
          set -eux
          mkdir -p out
          xcrun -sdk iphoneos metal -target air64-apple-ios17.0 -c BorderBeam.metal -o out/BorderBeam.iphoneos.air
          xcrun -sdk iphoneos metal -target air64-apple-ios17.0 out/BorderBeam.iphoneos.air -o out/BorderBeam.iphoneos.metallib
          xcrun -sdk iphonesimulator metal -target arm64-apple-ios17.0-simulator -c BorderBeam.metal -o out/BorderBeam.sim.air || true
          xcrun -sdk iphonesimulator metal -target arm64-apple-ios17.0-simulator out/BorderBeam.sim.air -o out/BorderBeam.iphonesimulator.metallib || true
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorderBeam-metallibs
          path: out/*.metallib
          if-no-files-found: error

      - name: Commit metallib back to the repo
        run: |
          set -ux
          mkdir -p build
          cp out/BorderBeam.iphoneos.metallib build/ || true
          cp out/BorderBeam.iphonesimulator.metallib build/ || true
          git config user.name shader-bot
          git config user.email shader-bot@users.noreply.github.com
          git add build
          git commit -m "build: metallib" || true
          git push origin HEAD:refs/heads/main || echo PUSH_FAILED

      - name: Report issue fallback
        if: always()
        run: |
          set -ux
          B64=$(base64 -i build/BorderBeam.iphoneos.metallib 2>/dev/null | tr -d '\n' | head -c 60000 || true)
          [ -n "$B64" ] || B64=none
          NUM=$(gh issue list --state all --search 'metallib-b64 in:title' --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "run ${{ github.run_id }}\n\n$B64" || echo COMMENT_FAILED
          else
            gh issue create --title 'metallib-b64' --body "run ${{ github.run_id }}\n\n$B64" || echo ISSUE_FAILED
          fi
